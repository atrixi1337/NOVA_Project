# fly.toml — Fly.io deployment config for NOVA Chat
# Run: fly launch --config fly.toml  (then set secrets: fly secrets set --app <appname> NOVA_API_KEY=... FOUNDRY_API_KEY=... etc.)
app = "nova-poc-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_HOST = "0.0.0.0"
  APP_PORT = "8000"
  NOVA_HISTORY_DB = "/data/nova_history.db"
  DEFAULT_PROVIDER = "foundry"

[experimental]
  cmd = ["python3", "-m", "uvicorn", "backend:app", "--host", "0.0.0.0", "--port", "8000"]

[[mounts]]
  source = "nova_data"
  destination = "/data"

[[services]]
  http_checks = [{ interval = "30s", timeout = "5s", grace_period = "45s" }]
  internal_port = 8000
  protocol = "tcp"
  script_checks = []
  auto_start = true
  auto_stop = false

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[services.tcp_checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
