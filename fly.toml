# fly.toml app configuration file generated for sallaapam on 2026-08-27T20:55:59+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sallaapam'
primary_region = 'sin'

[experimental]
  cmd = ['python3', '-m', 'uvicorn', 'backend:app', '--host', '0.0.0.0', '--port', '8000']

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_HOST = '0.0.0.0'
  APP_PORT = '8000'
  DEFAULT_PROVIDER = 'foundry'
  NOVA_HISTORY_DB = '/data/nova_history.db'

[[mounts]]
  source = 'nova_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
