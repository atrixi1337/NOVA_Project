services:
  nova-poc:
    build: .
    image: nova-poc:latest
    container_name: nova-poc
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Persist chat history (SQLite) across container rebuilds/restarts.
    volumes:
      - ./nova_history.db:/app/nova_history.db
    restart: unless-stopped
