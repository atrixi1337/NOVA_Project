<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0ea5e2">
  <title>NOVA • mobile</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.png" sizes="any">
  <style>
    :root{--ok:#16a34a;--bad:#94a3b8;--bg:#0f172a;--card:#1e293b;--tx:#f1f5f7;--muted:#94a3b8;--accent:#0ea5e2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemDashboard,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    header{display:flex;align-items:center;gap:.6rem;padding:14px 18px;border-bottom:1px solid #334155}
    header h1{font-size:17px;margin:0;font-weight:600}
    #status{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:9px;vertical-align:middle}
    #status.up{background:var(--ok)}
    main{padding:16px}
    .card{background:var(--card);border:1px solid #334155;border-radius:12px;padding:14px 16px;margin-bottom:12px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
    .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
    .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
    .pname{font-size:13px}
    .summary{color:var(--muted);font-size:13px;margin-top:6px}
    footer{padding:12px 16px 26px;color:#64748b;font-size:12px;text-align:center}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <header>
    <h1>NOVA • mobile <span id="status"></span></h1>
    <span class="summary" id="hdr"></span>
  </header>
  <main>
    <div class="card">
      <div style="font-size:14px;font-weight:600">Providers</div>
      <div class="cards" id="grid" style="margin-top:10px">…loading</div>
      <div class="summary" id="sum"></div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600">Endpoints</div>
      <div class="summary" style="margin-top:8px">
        GET <code>/api/health</code>, <code>/api/models</code>, <code>/mobile</code> are public.<br>
        POST/PUT/DELETE are gated by <code>Authorization: Bearer &lt;NOVA_ADMIN_KEY&gt;</code>
        (the key lives in the phone’s <code>~/.env</code>, never shipped to the browser).
      </div>
    </div>
  </main>
  <footer>
    served from <a href="https://nova.terminalflaw.xyz/" target="_blank">nova.terminalflaw.xyz</a>
  </footer>
  <script>
    const el = id => document.getElementById(id);
    const dot = on => '<span class="dot '+(on?'on':'off')+'"></span>';
    async function refresh(){
      const grid = el('grid'), sum = el('sum'), hdr = el('hdr');
      try{
        const r = await fetch('/api/health', {cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d = await r.json();
        el('status').className = d.status==='ok' ? 'up' : '';
        hdr.textContent = d.status==='ok' ? 'live' : 'degraded';
        grid.innerHTML='';
        let configured=0;
        Object.entries(d.providers).forEach(([k,p])=>{
          const c = !!p.configured; if(c) configured++;
          const div=document.createElement('div');
          div.innerHTML = dot(c)+'<div class="pname">'+p.label+'</div>';
          grid.appendChild(div);
        });
        sum.textContent = 'status: '+d.status+' · '+configured+'/'+Object.keys(d.providers).length+' configured · gemini backup keys: '+d.gemini_keys;
      }catch(e){
        el('status').className=''; hdr.textContent='down'; grid.textContent=''; sum.textContent='error: '+e;
      }
    }
    refresh(); setInterval(refresh, 15000);
  </script>
</body>
</html>
